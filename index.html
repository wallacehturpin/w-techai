
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My AI</title>

    <meta name="description" content="Chat with my own artificial intelligence.">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>My AI</h1>
        <p>Your own artificial intelligence</p>
    </header>

    <main>

        <div id="chat">
            <div class="message ai">
                Hello! I'm your own AI. What would you like to talk about?
            </div>
        </div>

        <div class="input-area">
            <input
                id="userInput"
                type="text"
                placeholder="Ask me something..."
                autocomplete="off"
            >

            <button id="sendButton">Send</button>
        </div>

    </main>

    <footer>
        <p>© 2026 All rights reserved.</p>
    </footer>

    <script src="ai.js"></script>
    <script src="script.js"></script>

</body>
</html>
